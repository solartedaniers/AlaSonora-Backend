spring.config.import=optional:file:.env[.properties]

spring.application.name=backend
server.port=8083

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URI}
# Spring Boot defaults this to RS256 only; Supabase signs its JWTs with ES256
# (its JWKS advertises "alg":"ES256"), so without this every real token gets
# rejected as an "Unsupported algorithm" before signature checking even runs.
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256

app.cors.allowed-origins=http://localhost:4200

# Async controller methods (POST /api/detections/classify) get this long to
# complete before Spring gives up and returns 503 to the client.
spring.mvc.async.request-timeout=${MVC_ASYNC_TIMEOUT_MS:25000}

# Traducción dinámica (sin diccionario local) del nombre común al español
# para especies auto-registradas por la IA; ver WikidataSpeciesCommonNameTranslator.
species.translation.timeout-ms=${SPECIES_TRANSLATION_TIMEOUT_MS:3000}

# AI engine: decoupled Python/FastAPI service running BirdNET.
ai.engine.base-url=${AI_ENGINE_BASE_URL:http://localhost:8000}
ai.engine.api-key=${AI_ENGINE_API_KEY}
ai.engine.timeout-ms=${AI_ENGINE_TIMEOUT_MS:20000}
ai.engine.min-confidence=${AI_ENGINE_MIN_CONFIDENCE:0.1}
ai.engine.max-results=${AI_ENGINE_MAX_RESULTS:3}

# Bulkhead thread pool isolating AI work from Tomcat's HTTP threads.
ai.executor.core-pool-size=${AI_EXECUTOR_CORE_POOL_SIZE:4}
ai.executor.max-pool-size=${AI_EXECUTOR_MAX_POOL_SIZE:8}
ai.executor.queue-capacity=${AI_EXECUTOR_QUEUE_CAPACITY:50}

# Organic catalog growth defaults for species auto-registered from an AI classification.
ai.catalog.default-species-image-url=${AI_DEFAULT_SPECIES_IMAGE_URL:/images/bird-silhouette-default.svg}
ai.catalog.disclaimer=${AI_CLASSIFICATION_DISCLAIMER:Esta identificacion fue generada por un modelo de inteligencia artificial (BirdNET) y es una referencia probabilistica; valida el resultado en campo antes de tratarlo como un registro cientifico confirmado.}