spring.config.import=optional:file:.env[.properties]

spring.application.name=backend
# Render inyecta el puerto en PORT (no es fijo); en local se usa 8083.
server.port=${PORT:8083}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
# Apagado por defecto: el SQL no va al log de producción; en desarrollo lo enciendo con JPA_SHOW_SQL=true.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URI}
# Spring Boot solo acepta RS256 por defecto; Supabase firma sus JWT con ES256
# (su JWKS anuncia "alg":"ES256"), así que sin esto todo token real se rechaza
# como "Unsupported algorithm" antes de verificar la firma.
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256

# 4200 = `ng serve` (desarrollo); 4000 = servidor Node de SSR/ISR del frontend
# (`npm run serve:ssr:frontend`), que sirve la app desde otro origen.
app.cors.allowed-origins=http://localhost:4200,http://localhost:4000

# El frontend distingue cada error por errorCode (ApiErrorCode), así que no envío el mensaje interno.
server.error.include-message=never

# Supabase Admin API: panel de administración (alta y suspensión de usuarios)
# y firmado de URLs de Storage bajo demanda (audio de grabaciones, fotos del observador).
supabase.url=${SUPABASE_URL}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.storage.recordings-bucket=${SUPABASE_RECORDINGS_BUCKET:recordings}
supabase.storage.observer-photos-bucket=${SUPABASE_OBSERVER_PHOTOS_BUCKET:observer-photos}
# Solo debe alcanzar para la sesión de visualización del usuario, no para
# almacenamiento permanente: la URL firmada se regenera en cada solicitud.
supabase.storage.signed-url-ttl-seconds=${SUPABASE_SIGNED_URL_TTL_SECONDS:120}

# Limpieza de grabaciones huerfanas del bucket "recordings" (subidas pero
# nunca guardadas como deteccion). min-age protege los resultados en revision
# y las sincronizaciones offline en curso.
storage.orphan-recordings.enabled=${ORPHAN_RECORDINGS_CLEANUP_ENABLED:true}
storage.orphan-recordings.min-age=${ORPHAN_RECORDINGS_MIN_AGE:PT24H}
storage.orphan-recordings.batch-size=${ORPHAN_RECORDINGS_BATCH_SIZE:100}
storage.orphan-recordings.initial-delay=${ORPHAN_RECORDINGS_INITIAL_DELAY:PT5M}
storage.orphan-recordings.interval=${ORPHAN_RECORDINGS_INTERVAL:PT24H}

# Tiempo que tienen los controladores asíncronos (POST /api/detections/classify)
# antes de que Spring desista y responda 503 al cliente.
spring.mvc.async.request-timeout=${MVC_ASYNC_TIMEOUT_MS:30000}

# Traducción dinámica (sin diccionario local) del nombre común al español
# para especies auto-registradas por la IA; ver WikidataSpeciesCommonNameTranslator.
species.translation.endpoint=${SPECIES_TRANSLATION_ENDPOINT:https://query.wikidata.org/sparql}
# Wikimedia pide un User-Agent con forma de contacto; sin ella puede limitar las consultas desde la nube.
species.translation.user-agent=${SPECIES_TRANSLATION_USER_AGENT:AlaSonora/1.0 (https://alasonora.com; bioacoustic bird identification)}
species.translation.timeout-ms=${SPECIES_TRANSLATION_TIMEOUT_MS:3000}

# Xeno-canto: referencia de tipos de vocalización típicos por especie
# (metadata de la especie, nunca análisis de la grabación puntual del usuario).
xeno-canto.api-key=${XENO_CANTO_API_KEY}
xeno-canto.timeout-ms=${XENO_CANTO_TIMEOUT_MS:5000}

# Motor de IA: servicio Python/FastAPI desacoplado que ejecuta BirdNET.
ai.engine.base-url=${AI_ENGINE_BASE_URL:http://localhost:8000}
ai.engine.api-key=${AI_ENGINE_API_KEY}
ai.engine.timeout-ms=${AI_ENGINE_TIMEOUT_MS:20000}
ai.engine.min-confidence=${AI_ENGINE_MIN_CONFIDENCE:0.1}
ai.engine.max-results=${AI_ENGINE_MAX_RESULTS:3}
# Reintento: ante un fallo rápido (conexión rechazada, 502/503/504) se reintenta una vez si aún cabe
# antes de spring.mvc.async.request-timeout.
# Bajar la grabación de Storage es rápido: timeout propio para que descarga + análisis quepan en el límite.
ai.engine.audio-fetch-timeout-ms=${AI_ENGINE_AUDIO_FETCH_TIMEOUT_MS:5000}
ai.engine.retry-attempts=${AI_ENGINE_RETRY_ATTEMPTS:1}
ai.engine.retry-backoff-ms=${AI_ENGINE_RETRY_BACKOFF_MS:1500}
ai.engine.async-safety-margin-ms=${AI_ENGINE_ASYNC_SAFETY_MARGIN_MS:1000}

# Despertar: /api/ai/status responde al instante y, si el motor no está listo, lanzo un solo GET /health
# en segundo plano. Render retiene esa petición mientras arranca el motor; si se corta, reintento hasta
# el tiempo total. Solo pasa cuando alguien con sesión pide el estado: no hay ninguna consulta programada.
ai.wake.attempt-timeout-ms=${AI_ENGINE_WAKE_TIMEOUT_MS:90000}
ai.wake.max-duration-ms=${AI_ENGINE_WAKE_MAX_DURATION_MS:300000}
ai.wake.retry-backoff-ms=${AI_ENGINE_WAKE_RETRY_BACKOFF_MS:5000}
# Render apaga el motor tras 15 min sin tráfico: un "listo" de 10 min o menos nunca es falso.
ai.wake.ready-fresh-ms=${AI_ENGINE_STATUS_FRESH_MS:600000}

# Pool bulkhead que aísla el trabajo de IA de los hilos HTTP de Tomcat.
ai.executor.core-pool-size=${AI_EXECUTOR_CORE_POOL_SIZE:4}
ai.executor.max-pool-size=${AI_EXECUTOR_MAX_POOL_SIZE:8}
ai.executor.queue-capacity=${AI_EXECUTOR_QUEUE_CAPACITY:50}

# Aviso que acompaña a cada clasificación de IA (sin foto de especie, el frontend usa su propia ilustración).
ai.catalog.disclaimer=${AI_CLASSIFICATION_DISCLAIMER:Esta identificacion fue generada por un modelo de inteligencia artificial y es una referencia probabilistica; valida el resultado en campo antes de tratarlo como un registro cientifico confirmado.}

# Identificación por foto: mismo motor Python (ai.engine.*), otro endpoint.
ai.photo.min-confidence=${AI_PHOTO_MIN_CONFIDENCE:0.3}
ai.photo.max-results=${AI_PHOTO_MAX_RESULTS:3}

# Nombre de usuario: solo letras y números, con este largo (debe coincidir con environment.username).
profile.username.min-length=${USERNAME_MIN_LENGTH:3}
profile.username.max-length=${USERNAME_MAX_LENGTH:20}

# Tamaño máximo del audio a clasificar (10 MB). Supabase gratis acepta 50 MB, pero el motor decodifica el
# audio completo en memoria en una instancia de 512 MB. Debe coincidir con environment.audioUpload.
audio.upload.max-bytes=${AUDIO_UPLOAD_MAX_BYTES:10485760}

# Campana: cuántos avisos guarda el historial y hasta qué distancia nombro el lugar conocido más cercano.
notifications.history-size=${NOTIFICATIONS_HISTORY_SIZE:30}
notifications.area-max-distance-km=${NOTIFICATIONS_AREA_MAX_DISTANCE_KM:60}
